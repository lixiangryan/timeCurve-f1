
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>F1 Time Curve Analysis: 2024 Japan S-Curves</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: #eee; text-align: center; }
        #chart { background: #222; margin: 20px auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .controls { margin: 20px; }
        button { background: #e10600; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #ff1e1e; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
        .legend { font-size: 14px; margin-top: 10px; }
        .driver-label { font-weight: bold; margin: 0 10px; }
    </style>
</head>
<body>

    <h1>F1 Time Curve: S-Curves Comparison</h1>
    <p>Drivers: Verstappen (1), Perez (11), Tsunoda (22)</p>

    <div class="controls">
        <button id="playBtn">Play Animation</button>
        <input type="range" id="timeSlider" min="0" max="100" value="0" style="width: 300px; margin-left: 20px;">
    </div>

    <div id="chart"></div>
    <div class="legend">
        <span class="driver-label" style="color: #4facfe;">● Verstappen (1)</span>
        <span class="driver-label" style="color: #00f260;">● Perez (11)</span>
        <span class="driver-label" style="color: #ff0844;">● Tsunoda (22)</span>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        // Config
        const width = 800;
        const height = 600;
        const margin = {top: 20, right: 20, bottom: 20, left: 20};
        const colors = {1: '#4facfe', 11: '#00f260', 22: '#ff0844'}; // Blue, Green, Red

        // SVG Setup
        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Scales
        const xScale = d3.scaleLinear().range([0, width - margin.left - margin.right]);
        const yScale = d3.scaleLinear().range([height - margin.top - margin.bottom, 0]);

        // Load Data
        d3.csv("comparison_scurve_data.csv").then(data => {
            
            // Parse numbers
            data.forEach(d => {
                d.mds_x = +d.mds_x;
                d.mds_y = +d.mds_y;
                d.driver = +d.driver;
                d.speed = +d.speed;
                d.throttle = +d.throttle;
                d.brake = +d.brake;
            });

            // Set Domains
            xScale.domain(d3.extent(data, d => d.mds_x));
            yScale.domain(d3.extent(data, d => d.mds_y));

            // Group by Driver
            const drivers = [1, 11, 22];
            const nestedData = drivers.map(id => {
                return {
                    id: id,
                    values: data.filter(d => d.driver === id)
                };
            });

            // Draw Curves (Background)
            const line = d3.line()
                .x(d => xScale(d.mds_x))
                .y(d => yScale(d.mds_y))
                .curve(d3.curveCatmullRom.alpha(0.5));

            g.selectAll(".trace")
                .data(nestedData)
                .enter().append("path")
                .attr("class", "trace")
                .attr("d", d => line(d.values))
                .attr("stroke", d => colors[d.id])
                .attr("stroke-width", 2)
                .attr("fill", "none")
                .attr("opacity", 0.3); // Faint background trail

            // Draw Moving Dots
            const dots = g.selectAll(".dot")
                .data(nestedData)
                .enter().append("circle")
                .attr("class", "dot")
                .attr("r", 8)
                .attr("fill", d => colors[d.id])
                .attr("stroke", "#fff")
                .attr("stroke-width", 2);

            // Animation Logic
            let maxSteps = d3.max(nestedData, d => d.values.length);
            let currentStep = 0;
            let isPlaying = false;
            let timer;

            function update(step) {
                currentStep = step;
                d3.select("#timeSlider").property("value", step);
                
                dots.each(function(d) {
                    const idx = Math.min(step, d.values.length - 1);
                    const point = d.values[idx];
                    
                    d3.select(this)
                        .attr("cx", xScale(point.mds_x))
                        .attr("cy", yScale(point.mds_y));
                        
                    // Tooltip update if needed (simple logic)
                });
            }

            // Slider Config
            d3.select("#timeSlider")
                .attr("max", maxSteps - 1)
                .on("input", function() {
                    stop();
                    update(+this.value);
                });

            // Play/Pause
            function play() {
                if (isPlaying) return;
                isPlaying = true;
                d3.select("#playBtn").text("Pause");
                
                timer = setInterval(() => {
                    currentStep++;
                    if (currentStep >= maxSteps) currentStep = 0; // Loop
                    update(currentStep);
                }, 100); // 100ms per step
            }

            function stop() {
                isPlaying = false;
                d3.select("#playBtn").text("Play Animation");
                clearInterval(timer);
            }

            d3.select("#playBtn").on("click", function() {
                if (isPlaying) stop();
                else play();
            });

            // Initialize
            update(0);

        }).catch(err => {
            console.error(err);
            d3.select("#chart").append("p").text("Error loading CSV data. Please check console.");
        });

    </script>
</body>
</html>
